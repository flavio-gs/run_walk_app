
name: iOS Release Build

on:
  workflow_dispatch:
  push:
    branches:
      - develop

jobs:
  build:

    # ==========================================
    # MESMA BASE DO CODEMAGIC
    # ==========================================

    runs-on: macos-latest
    timeout-minutes: 90

    env:
      BUNDLE_ID: com.nexus.runWalkApp
      XCODE_PROJECT: ios/Runner.xcodeproj
      XCODE_SCHEME: Runner

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # XCODE (mais próximo do Codemagic)
      # ==========================================

      - name: Select Xcode 15.2
        run: |

          sudo xcode-select -s /Applications/Xcode_15.2.app

          echo "===== XCODE ====="
          xcodebuild -version

          echo "===== SWIFT ====="
          swift --version

      # ==========================================
      # JAVA 17
      # ==========================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # ==========================================
      # FLUTTER
      # ==========================================

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          cache: true

      # ==========================================
      # CACHE PUB
      # ==========================================

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # ==========================================
      # CLEAN
      # ==========================================

      - name: Clean project
        run: |

          flutter clean
          rm -rf ios/Pods

      # ==========================================
      # INSTALL DEPENDENCIES
      # ==========================================

      - name: Install Flutter dependencies
        run: |

          flutter pub get

      # ==========================================
      # IOS PRECACHE
      # ==========================================

      - name: Precache iOS
        run: |

          flutter precache --ios

      # ==========================================
      # COCOAPODS
      # ==========================================

      - name: Install CocoaPods
        run: |

          cd ios
          
          pod install

      # ==========================================
      # VERIFY PODS
      # ==========================================

      - name: Verify Pods
        run: |

          ls -la ios/Pods/Target\ Support\ Files/Pods-Runner/

      # ==========================================
      # CREATE EXPORT OPTIONS
      # ==========================================

      - name: Create ExportOptions.plist
        run: |

          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">

          <plist version="1.0">
          <dict>

              <key>method</key>
              <string>app-store</string>

              <key>teamID</key>
              <string>${{ secrets.APPLE_TEAM_ID }}</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>stripSwiftSymbols</key>
              <true/>

              <key>compileBitcode</key>
              <false/>

              <key>provisioningProfiles</key>
              <dict>

                  <key>com.nexus.runWalkApp</key>
                  <string>CodeNovo</string>

                  <key>com.nexus.runWalkApp.RunLiveActivity</key>
                  <string>RunLiveActivity</string>

              </dict>

          </dict>
          </plist>
          EOF

      # ==========================================
      # CREATE KEYCHAIN
      # ==========================================

      - name: Create temporary keychain
        run: |

          security create-keychain \
            -p "${{ secrets.KEYCHAIN_PASSWORD }}" \
            build.keychain

          security default-keychain \
            -s build.keychain

          security unlock-keychain \
            -p "${{ secrets.KEYCHAIN_PASSWORD }}" \
            build.keychain

          security set-keychain-settings \
            -lut 21600 \
            build.keychain

          security list-keychains \
            -d user \
            -s build.keychain login.keychain

      # ==========================================
      # IMPORT CERTIFICATE
      # ==========================================

      - name: Import certificate
        run: |

          echo "${{ secrets.IOS_CERTIFICATE }}" | base64 --decode > certificate.p12

          security import certificate.p12 \
            -k build.keychain \
            -P "${{ secrets.IOS_CERTIFICATE_PASSWORD }}" \
            -A

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${{ secrets.KEYCHAIN_PASSWORD }}" \
            build.keychain

      # ==========================================
      # INSTALL PROFILES
      # ==========================================

      - name: Install provisioning profiles
        run: |

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          echo "${{ secrets.APP_PROFILE }}" | base64 --decode > app.mobileprovision

          echo "${{ secrets.LIVE_PROFILE }}" | base64 --decode > live.mobileprovision

          cp app.mobileprovision \
            ~/Library/MobileDevice/Provisioning\ Profiles/

          cp live.mobileprovision \
            ~/Library/MobileDevice/Provisioning\ Profiles/

      # ==========================================
      # VERIFY CERTIFICATES
      # ==========================================

      - name: Verify signing identities
        run: |

          security find-identity -v -p codesigning

      # ==========================================
      # FLUTTER BUILD IOS
      # ==========================================

      - name: Flutter build iOS
        run: |

          flutter build ios --release --no-codesign

      # ==========================================
      # ARCHIVE APP
      # ==========================================

      - name: Archive app
        run: |

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/Runner.xcarchive \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            CODE_SIGN_STYLE=Manual \
            archive

      # ==========================================
      # EXPORT IPA
      # ==========================================

      - name: Export IPA
        run: |

          xcodebuild \
            -exportArchive \
            -archivePath build/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build/ios/ipa

      # ==========================================
      # VERIFY IPA
      # ==========================================

      - name: Verify IPA
        run: |

          ls -lah build/ios/ipa/

      # ==========================================
      # UPLOAD TO TESTFLIGHT
      # ==========================================

      - name: Upload to TestFlight
        run: |

          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -n 1)

          mkdir -p ~/.appstoreconnect/private_keys

          echo "${{ secrets.APPSTORE_API_PRIVATE_KEY }}" > \
            ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_API_KEY_ID }}.p8

          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "${{ secrets.APPSTORE_API_KEY_ID }}" \
            --apiIssuer "${{ secrets.APPSTORE_ISSUER_ID }}"

      # ==========================================
      # UPLOAD IPA ARTIFACT
      # ==========================================

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: build/ios/ipa/*.ipa
