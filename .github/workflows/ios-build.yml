name: iOS Signed Build

on:
  workflow_dispatch:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: macos-latest

    steps:
      # =========================
      # CHECKOUT
      # =========================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # FLUTTER
      # =========================

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          cache: true

      # =========================
      # CACHE
      # =========================

      - name: Cache pub dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}

      - name: Cache CocoaPods
        uses: actions/cache@v3
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}

      # =========================
      # CLEAN IOS
      # =========================

      - name: Clean iOS build
        run: |
          flutter clean
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock

      # =========================
      # INSTALL DEPENDENCIES
      # =========================

      - name: Install Flutter dependencies
        run: flutter pub get

      # =========================
      # INSTALL COCOAPODS
      # =========================

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod repo update
          pod install --verbose

      # =========================
      # CREATE KEYCHAIN
      # =========================

      - name: Create temporary keychain
        run: |
          security create-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain
          security set-keychain-settings -lut 21600 build.keychain

      # =========================
      # IMPORT CERTIFICATE
      # =========================

      - name: Import certificate
        run: |
          echo "${{ secrets.IOS_CERTIFICATE }}" | base64 --decode > certificate.p12

          security import certificate.p12 \
            -k build.keychain \
            -P "${{ secrets.IOS_CERTIFICATE_PASSWORD }}" \
            -T /usr/bin/codesign

      # =========================
      # INSTALL PROVISION PROFILE
      # =========================

      - name: Install provisioning profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          echo "${{ secrets.IOS_PROVISION_PROFILE }}" | base64 --decode > profile.mobileprovision

          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      # =========================
      # BUILD IPA
      # =========================

      - name: Build signed IPA
        run: flutter build ipa --release --verbose

      # =========================
      # UPLOAD IPA
      # =========================

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: build/ios/ipa/*.ipa
