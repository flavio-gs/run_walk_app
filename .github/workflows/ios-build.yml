name: iOS Signed Build

on:
  workflow_dispatch:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: macos-13
    timeout-minutes: 60

    steps:

      # =========================
      # CHECKOUT
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # SELECT XCODE 15.4
      # =========================
      - name: Select Xcode 15.4
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app

          echo "===== XCODE VERSION ====="
          xcodebuild -version

          echo "===== SWIFT VERSION ====="
          swift --version

      # =========================
      # FLUTTER
      # =========================
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          cache: true

      # =========================
      # CACHE PUB
      # =========================
      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # =========================
      # CLEAN IOS
      # =========================
      - name: Clean iOS build
        run: |
          flutter clean
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock

      # =========================
      # INSTALL FLUTTER DEPENDENCIES
      # =========================
      - name: Install Flutter dependencies
        run: |
          flutter pub get

      # =========================
      # GENERATE IOS FILES
      # =========================
      - name: Generate iOS Flutter config
        run: |
          flutter precache --ios

      # =========================
      # COCOAPODS
      # =========================
      - name: Install CocoaPods dependencies
        run: |
          cd ios

          pod deintegrate || true

          pod install --repo-update

      # =========================
      # VERIFY PODS
      # =========================
      - name: Verify Pods scripts
        run: |
          ls -la ios/Pods/Target\ Support\ Files/Pods-Runner/

      # =========================
      # CREATE EXPORT OPTIONS
      # =========================
      - name: Create ExportOptions.plist
        run: |
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>

              <key>method</key>
              <string>app-store</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>stripSwiftSymbols</key>
              <true/>

              <key>compileBitcode</key>
              <false/>

          </dict>
          </plist>
          EOF

      # =========================
      # KEYCHAIN
      # =========================
      - name: Create temporary keychain
        run: |
          security create-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain

          security default-keychain -s build.keychain

          security unlock-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain

          security set-keychain-settings -lut 21600 build.keychain

          security list-keychains -d user -s build.keychain login.keychain

      # =========================
      # IMPORT CERTIFICATE
      # =========================
      - name: Import certificate
        run: |
          echo "${{ secrets.IOS_CERTIFICATE }}" | base64 --decode > certificate.p12

          security import certificate.p12 \
            -k build.keychain \
            -P "${{ secrets.IOS_CERTIFICATE_PASSWORD }}" \
            -A

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${{ secrets.KEYCHAIN_PASSWORD }}" \
            build.keychain

      # =========================
      # INSTALL PROVISION PROFILE
      # =========================
      - name: Install provisioning profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          echo "${{ secrets.IOS_PROVISION_PROFILE }}" | base64 --decode > profile.mobileprovision

          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i profile.mobileprovision)")

          cp profile.mobileprovision \
            ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision

      # =========================
      # VERIFY CERTIFICATES
      # =========================
      - name: Verify certificates
        run: |
          security find-identity -v -p codesigning

      # =========================
      # BUILD IPA
      # =========================
      - name: Build and Sign IPA
        run: |
          flutter build ipa \
            --release \
            --export-options-plist=ios/ExportOptions.plist

      # =========================
      # VERIFY IPA
      # =========================
      - name: Verify IPA exists
        run: |
          ls -lah build/ios/ipa/

      # =========================
      # UPLOAD TO TESTFLIGHT
      # =========================
      - name: Upload to TestFlight
        run: |
          xcrun iTMSTransporter \
            -m upload \
            -assetFile build/ios/ipa/*.ipa \
            -u "${{ secrets.APPLE_USERNAME }}" \
            -p "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}"

      # =========================
      # UPLOAD IPA ARTIFACT
      # =========================
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: build/ios/ipa/*.ipa
