name: run_walk_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  audioplayers: ^6.0.0
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  http: ^1.2.2
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  google_fonts: ^6.2.0

  # ✅ Firebase (Geração 3.x compatível entre si)
  firebase_core: ^3.7.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_analytics: ^11.2.1
  connectivity_plus: ^6.1.0
  shared_preferences: ^2.3.2

  # Localização e GPS
  location: ^5.0.3
  geolocator: ^10.1.0

  confetti: ^0.7.0

  # Google Maps
  google_maps_flutter: ^2.5.0

  # Auth Google
  google_sign_in: ^6.2.1

  # Estado
  provider: ^6.1.2
  flutter_riverpod: ^2.6.1

  # Datas e formatação
  intl: ^0.19.0
  timeago: ^3.7.0

  flutter_animate: ^4.5.0
  reaction_button: ^0.0.7



  model_viewer_plus: ^1.9.1
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/logo_principal.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icon/logo_principal.png"

flutter:
  uses-material-design: true
  assets:
    - assets/map_style.json
    - assets/map_style_day.json
    - assets/click.mp3
    - assets/sounds/start.mp3
    - assets/sounds/stop.mp3
    - assets/icon/logo_principal.png
