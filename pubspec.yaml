name: run_walk_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.6.0


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  http: ^1.2.2

  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  google_fonts: ^6.2.0

  # Firebase
  firebase_core: ^4.0.0          
  firebase_auth: ^6.0.0          
  cloud_firestore: ^6.0.0        

  # Localização e GPS
  location: ^5.0.3               
  geolocator: ^10.1.0

  # Google Maps
  google_maps_flutter: ^2.5.0    

  #Auth Google
  google_sign_in: ^6.2.1

  # Estado gerenciado
  provider: ^6.1.2               

  # Datas e formatações
  intl: ^0.19.0                  
  timeago: ^3.6.1

  # (opcional) Firebase Analytics, Crashlytics etc
  firebase_analytics: ^12.0.0 
  
  flutter_riverpod: ^2.6.1
  flutter_launcher_icons: ^0.14.4

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/logo_principal.png"
  adaptive_icon_background: "#ffffff" # Pode ser transparente
  adaptive_icon_foreground: "assets/icon/logo_principal.png"


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0


flutter:
  uses-material-design: true

  assets: 
    - assets/map_style.json
 