workflows:
  ios-release:
    name: iOS Release Build

    max_build_duration: 120

    environment:
      flutter: 3.41.2
      xcode: 15.4
      cocoapods: default

      vars:
        BUNDLE_ID: "com.nexus.runWalkApp"

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.nexus.runWalkApp

    integrations:
      app_store_connect: Codemagicv1

    scripts:

      # =========================
      # FLUTTER CLEAN
      # =========================
      - name: Flutter clean
        script: |
          flutter clean

      # =========================
      # PUB GET
      # =========================
      - name: Install dependencies
        script: |
          flutter pub get

      # =========================
      # IOS PRECACHE
      # =========================
      - name: Precache iOS
        script: |
          flutter precache --ios

      # =========================
      # COCOAPODS
      # =========================
      - name: Install CocoaPods
        script: |
          cd ios

          rm -rf Pods
          rm -rf Podfile.lock

          pod repo update
          pod install

      # =========================
      # VERIFY XCODE
      # =========================
      - name: Verify versions
        script: |
          echo "===== XCODE ====="
          xcodebuild -version

          echo "===== SWIFT ====="
          swift --version

          echo "===== FLUTTER ====="
          flutter --version

      # =========================
      # BUILD IPA
      # =========================
      - name: Build IPA
        script: |
          flutter build ipa \
            --release \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
